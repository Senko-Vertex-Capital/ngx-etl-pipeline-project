name: Drive to DB Pipeline

on:
  push:
    branches:
      - feature/drive-to-db
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-pipeline:
    name: Parse Excel files and load to Neon DB
    runs-on: ubuntu-latest

    env:
      NEON_CONN:         ${{ secrets.NEON_CONN }}
      NEON_TABLE:        ${{ secrets.NEON_TABLE }}
      GDRIVE_INCOME_ID:  ${{ secrets.GDRIVE_INCOME_ID }}
      GDRIVE_BALANCE_ID: ${{ secrets.GDRIVE_BALANCE_ID }}
      GDRIVE_CASHFLOW_ID: ${{ secrets.GDRIVE_CASHFLOW_ID }}

    steps:

      # ── 1. Checkout the repo ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # ── 2. Pull LFS files ──────────────────────────────────────────
      - name: Pull LFS files
        run: git lfs pull

      # ── 3. Set up Python ───────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 4. Install dependencies ────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl numpy psycopg2-binary "psycopg[binary]" gdown sqlalchemy

      # ── 5. Download Excel files from Google Drive ──────────────────
      - name: Download files from Google Drive
        run: |
          mkdir -p data
          gdown $GDRIVE_INCOME_ID  -O data/IncomeStatement.xlsx
          gdown $GDRIVE_BALANCE_ID -O data/BalanceSheet.xlsx
          gdown $GDRIVE_CASHFLOW_ID -O data/CashFlow.xlsx

      # ── 6. Confirm files downloaded ────────────────────────────────
      - name: List data files
        run: |
          echo "Files in data/ folder:"
          ls -lh data/

      # ── 7. Run the pipeline ────────────────────────────────────────
      - name: Run pipeline
        run: python drive_to_db.py

      # ── 8. Done ────────────────────────────────────────────────────
      - name: Done
        run: |
          echo "✓ Pipeline complete"
          echo "  Tables loaded:"
          echo "  - ${{ secrets.NEON_TABLE }}_income_statement"
          echo "  - ${{ secrets.NEON_TABLE }}_balance_sheet"
          echo "  - ${{ secrets.NEON_TABLE }}_cash_flow"
